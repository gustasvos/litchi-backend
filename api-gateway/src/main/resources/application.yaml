spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
                - JwtAuth

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:eTTEiJfTx8A5uwzcUGXu7P1DxGiy39diM6YhqFL8RmU=}